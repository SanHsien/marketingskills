- skill: directory-submissions
  id: RA2
  path: references/directory-list.md
  message: '*plist*'
  reason: 字串 plist 只是公開目錄品牌 OnToplist 的子字串；文件不建立 launchd plist、cron 或跨 session 持久化。
- skill: events
  id: E4
  path: SKILL.md
  message: '*Capture context*'
  reason: Capture context 是請業務人員記錄活動對話重點以便跟進的行銷建議，不是外傳 agent 對話上下文。
- skill: marketing-loops
